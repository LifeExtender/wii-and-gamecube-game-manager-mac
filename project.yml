name: WiiGameManager
options:
  bundleIdPrefix: com.los
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  WiiKit:
    path: WiiKit

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  WiiGameManager:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helpers/wit
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Helpers/wwt
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Helpers/gpl-2.0.txt
        buildPhase: resources
      - path: Helpers/PROVENANCE.txt
        buildPhase: resources
    dependencies:
      - package: WiiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.los.wiigamemanager
        PRODUCT_NAME: Wii Game Manager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wii Game Manager
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: GPL v2 or later. Disc tools by Wiimms ISO Tools.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
